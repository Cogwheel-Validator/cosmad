serve_api = true
serve_dashboard = false

[pagerduty]
enabled = true

[discord]
enabled = true

[telegram]
enabled = true

[health_check]
enabled = true
ping = 60

[chain_configs.cosmoshub-4]
chain_type = "bft"

rpc_urls = [
  { url = "https://rpc.cosmos.network", alert_if_down = true }
]

alert_config = {
  alert_if_inactive = true,
  stalled_alert = { enabled = true, stalled_threshold = 60 },
  consecutive_miss_alert = { enabled = true, threshold = 50, repeat = false, repeat_interval = 300 },
  percentage_missed_blocks_alert = { enabled = false, threshold = 10.0, repeat = false }
}
