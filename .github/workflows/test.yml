name: Test Cosmad

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"

jobs:
  test:
    name: Test JS/TS code
    permissions:
      contents: read
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["24.x", "26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1
        with:
          node-version: ${{ matrix.node-version}}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Run install
        run: pnpm install --frozen-lockfile

      - name: Run vitest with coverage
        run: pnpm run test --coverage --coverage.reporter=json-summary

      - name: Check coverage
        run: node .github/workflows/files/check_coverage.js
