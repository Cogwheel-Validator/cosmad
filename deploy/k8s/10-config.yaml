# Global config contains notifier credentials, so it lives in a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cosmad-config
  namespace: cosmad
type: Opaque
stringData:
  config.toml: |
    serve_api = true
    serve_dashboard = true

    [telegram]
    enabled = true
    bot_token = "CHANGE_ME"
    chat_id = "-100000000000"
---
# One key per chain. The file name (minus .toml) is the chain id.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmad-chains
  namespace: cosmad
data:
  atomone-1.toml: |
    pretty_name = "Atom One"
    chain_type = "bft"
    valoper_address = "atonevaloper1CHANGE_ME"
    valcons_address = "atonevalcons1CHANGE_ME"
    rpc_urls = [{ url = "https://rpc.example.com", alert_if_down = true }]
    api_urls = [{ url = "https://api.example.com", alert_if_down = true }]

    alert_config = {
      alert_if_inactive = true,
      stalled_alert = { enabled = true, stalled_threshold = 60 },
      consecutive_miss_alert = { enabled = true, threshold = 50, repeat = true, repeat_interval = 300 },
      percentage_missed_blocks_alert = { enabled = true, threshold = 10.0, repeat = true }
    }
  onyx-1.toml: |
    pretty_name = "Gnoland Pearl"
    chain_type = "tm2"
    operator_address = "g1CHANGE_ME"
    signing_address = "g1CHANGE_ME"
    rpc_urls = [
      { url = "https://rpc.example.com", alert_if_down = true },
    ]
    poll_interval = 3s

    alert_config = {
      alert_if_inactive = true,
      stalled_alert = { enabled = true, stalled_threshold = 60 },
      consecutive_miss_alert = { enabled = true, threshold = 50, repeat = true, repeat_interval = 300 },
      percentage_missed_blocks_alert = { enabled = true, threshold = 10.0, repeat = true }
    }
